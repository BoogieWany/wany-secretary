<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fff4e8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1714" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex">
<title>비서</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 수첩 디자인 — 아이콘과 같은 따뜻한 종이 바탕 · 검정 잉크 · 코랄 한 점. 맨 위에서 비서가 오늘 상황을 말로 알려 줌 */
:root{color-scheme:light dark;--bg:light-dark(#fff4e8,#1b1714);--ink:light-dark(#15171c,#f4ece2);--sub:light-dark(#8a7f73,#a39788);--line:light-dark(#f1e3d1,#2e2823);--rail:light-dark(#e9d9c6,#3a322b);--soft:light-dark(#f8e9d8,#2a241f);--card:light-dark(#fffaf3,#231e1a);--edge:light-dark(#ead9c4,#00000000);--red:light-dark(#ff5a4d,#ff6b5e);--on:light-dark(#15171c,#f4ece2);--onink:light-dark(#fff4e8,#1b1714)}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;overflow-x:clip}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:640px;margin:0 auto;padding:0 max(5vw,22px)}
header{padding:26px 0 0}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
h1{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.logo{width:44px;height:44px;border-radius:12px;display:block}
.gear{color:var(--sub);padding:0 12px;height:40px;border-radius:999px;font-size:14px;transition:background .25s,color .25s}
.gear:hover,.gear[aria-expanded=true]{background:var(--soft);color:var(--ink)}
.say{font-size:clamp(22px,6.4vw,26px);line-height:1.35;font-weight:700;letter-spacing:-.02em;margin:22px 0 6px;text-wrap:balance;animation:fade .5s ease}
.say em{font-style:normal;color:var(--red)}
.today{margin:0;color:var(--sub);font-size:14px}
nav{display:flex;gap:8px;margin-top:22px}
nav a{color:var(--sub);text-decoration:none;padding:9px 18px;border-radius:999px;font-size:15px;font-weight:600;transition:background .3s,color .3s}
nav a.on{background:var(--on);color:var(--onink)}
nav a i{font-style:normal;margin-left:5px;opacity:.75}
main{padding:14px 0 96px}
.view{animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}}
.note{color:var(--sub);font-size:13px;margin:0}
.note:not(:empty){margin:4px 2px 8px}
.box{background:var(--card);border-radius:18px;padding:14px;box-shadow:0 1px 0 var(--edge)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{padding:7px 14px;border-radius:999px;color:var(--sub);font-size:14px;min-height:38px;transition:background .25s,color .25s}
.chip.on{background:var(--soft);color:var(--ink);font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.in{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 14px;min-height:46px;width:100%;transition:border-color .25s}
.in:focus{outline:0;border-color:var(--sub)}
.grow{flex:1 1 180px}
.go{background:var(--on);color:var(--onink);border-radius:12px;padding:0 20px;min-height:46px;font-weight:600;transition:opacity .2s}
.go:active{opacity:.7}
.lab{font-size:12px;color:var(--sub);margin:10px 2px 4px;display:block}
.fld{flex:1 1 150px}
.ring{background:var(--red);color:#fff;border-radius:18px;padding:13px 16px;margin:8px 0 4px;display:flex;justify-content:space-between;gap:12px;align-items:center;animation:fade .4s ease}
.ring b{display:block;font-size:12px;font-weight:500;opacity:.85}
.ring button{background:#fff;color:#d63a2f;border-radius:999px;padding:0 16px;min-height:38px;font-weight:600;flex:none}
h2{font-size:15px;font-weight:700;margin:28px 2px 10px;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
h2 b{font-weight:700}
h2 span{color:var(--sub);font-weight:500;font-size:13px}
ul{list-style:none;margin:0;padding:0}
.card{background:var(--card);border-radius:18px;padding:4px 16px;box-shadow:0 1px 0 var(--edge)}
.card li{display:flex;align-items:flex-start;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.card li:last-child{border-bottom:0}
.tl{position:relative;padding-left:28px}
.tl::before{content:"";position:absolute;left:8px;top:14px;bottom:14px;width:2px;background:var(--rail)}
.tl li{position:relative;padding:8px 0}
.tl li::before{content:"";position:absolute;left:-28px;top:13px;width:18px;height:18px;border-radius:50%;background:var(--bg);border:2px solid var(--ink);transition:background .3s,border-color .3s,box-shadow .3s}
.tl li.now::before{background:var(--red);border-color:var(--red);box-shadow:0 0 0 5px color-mix(in srgb,var(--red) 22%,transparent)}
.tl li.past{opacity:.45}
.tl .t{font-variant-numeric:tabular-nums;font-weight:700;margin-right:10px}
.tl li.now .t{color:var(--red)}
.tl b{font-size:17px}
.tl small{display:block;color:var(--sub);font-size:13px}
.tl .tag{margin-left:8px;vertical-align:2px}
.ck{flex:none;width:40px;height:30px;display:grid;place-items:center;margin-left:-8px}
.ck i{width:19px;height:19px;border-radius:50%;border:2px solid var(--ink);transition:background .25s,border-color .25s,box-shadow .25s}
.done .ck i{background:var(--ink);box-shadow:inset 0 0 0 3px var(--card)}
.body{flex:1}
.tx{display:block;padding:3px 4px;border-radius:8px;outline:0;overflow-wrap:anywhere;transition:background .25s}
.tx:focus{background:var(--soft)}
.done .tx{color:var(--sub);text-decoration:line-through}
.at{display:inline-block;margin:0 4px;font-size:12px;color:var(--red);white-space:nowrap}
.done .at{color:var(--sub)}
.sm{flex:none;height:30px;padding:0 8px;color:var(--sub);font-size:13px;border-radius:8px;white-space:nowrap;opacity:.7;transition:background .25s,color .25s,opacity .25s}
.sm:hover{background:var(--soft);opacity:1}
.sm.ask{color:var(--red);font-weight:600;opacity:1}
.empty{color:var(--sub);margin:0;font-size:14px;padding:2px}
.btn{background:var(--soft);border-radius:999px;padding:0 16px;min-height:42px;font-weight:500;font-size:14px;transition:opacity .2s}
.btn:active{opacity:.7}
.set{overflow:hidden;display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease}
.set.open{grid-template-rows:1fr}
.set>div{min-height:0}
.set .box{margin:6px 0 10px;display:grid;gap:10px}
.set p{margin:0;color:var(--sub);font-size:13px}
.it{flex:1}
.it b{font-weight:700}
.it small{display:block;color:var(--sub);font-size:13px;overflow-wrap:anywhere}
.tm{flex:none;width:86px;font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.tm small{display:block;font-weight:400;color:var(--sub);font-size:12px}
.tag{flex:none;display:inline-block;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--soft);color:var(--sub);white-space:nowrap}
.tag.hot{background:var(--red);color:#fff}
.tag.ink{background:var(--on);color:var(--onink)}
#gate,#tt{margin-top:12px}
#gate p,#tt p{font-size:13px;color:var(--sub);margin:8px 2px 12px}
.err{color:var(--red)!important}
.foot{color:var(--sub);font-size:12px;margin:22px 2px 0}
#f{margin-top:8px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="top">
    <h1>비서</h1><img class="logo" src="icon.svg" alt="" width="44" height="44">
    <button class="gear" id="gear" aria-expanded="false" hidden>설정</button>
  </div>
  <p class="say" id="say">비서</p><p class="today" id="today"></p>
  <nav id="nav" hidden>
    <a href="#today" data-v="today">오늘<i id="nToday"></i></a>
    <a href="#notes" data-v="notes">기록<i id="nNotes"></i></a>
  </nav>
</div></header>
<main><div class="wrap">
  <form class="box" id="gate" hidden>
    <label class="lab" for="tk" style="margin-top:2px">연결 키 (github_pat_…)</label>
    <input class="in" id="tk" type="password" autocomplete="off">
    <p id="gmsg">이 기기에 한 번만 넣으면 돼요.</p>
    <button class="go" type="submit" style="width:100%">열기</button>
  </form>
  <div class="set" id="set"><div><div class="box">
    <p id="nstate"></p>
    <div class="row"><button class="btn" id="non">이 기기에서 알림 켜기</button><button class="btn" id="sync">지금 새로 받기</button><button class="btn" id="ttout">시간표 연결 끊기</button><button class="btn" id="out">로그아웃</button></div>
    <p>알림은 이 화면이 열려 있거나 뒤에 켜져 있을 때 울려요.</p>
  </div></div></div>
  <div id="rings"></div>
  <p class="note" id="note"></p>
  <section class="view" id="vToday" hidden>
    <form class="box" id="tt" hidden>
      <label class="lab" for="tc" style="margin-top:2px">시간표 로그인 코드</label>
      <input class="in" id="tc" type="password" inputmode="numeric" autocomplete="off">
      <p id="tmsg">폰 시간표에 넣는 내 코드예요. 넣으면 오늘 수업·업무·시험·보강·상담·신입예정이 여기 보여요.</p>
      <button class="go" type="submit" style="width:100%">시간표 연결</button>
    </form>
    <div id="sum"></div>
  </section>
  <section class="view" id="vNotes" hidden>
    <form class="box" id="f">
      <div class="chips" id="chips"></div>
      <div class="row">
        <input class="in grow" id="t" type="text" autocomplete="off" aria-label="적을 내용" enterkeyhint="done">
        <button class="go" type="submit">적기</button>
      </div>
      <div class="row">
        <span class="fld" id="dbox"><label class="lab" for="d">회의 날짜</label><input class="in" id="d" type="date"></span>
        <span class="fld"><label class="lab" for="a">알림 시간 (없으면 비워 두기)</label><input class="in" id="a" type="datetime-local"></span>
      </div>
    </form>
    <div id="out2"></div>
  </section>
</div></main>
<script>
{
const OWNER='BoogieWany',REPO='wany-secretary',FILE='data.json';
const API=`https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE}`;
const TTSRC='../ymath-timetable/view.json';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const te=new TextEncoder(),td=new TextDecoder();
const b64=u=>{let s='';for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode(...u.subarray(i,i+8192));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const ls={get:k=>{try{return localStorage.getItem(k)}catch{return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch{}},del:k=>{try{localStorage.removeItem(k)}catch{}}};
const KINDS=[['todo','기억할 일'],['meeting','회의 안건'],['idea','아이디어']];
let token='',sha=null,items=[],kind='todo',showDone=false,busy=false,dirty=false,isNew=false,view='today',S=null,swReg=null,exAll=false;

/*SUMM-START — 시간표 폰 자료(푼 것)에서 내 것만 추려 냄. 화면과 따로 떼어 시험할 수 있게 순수 함수로 둠 */
const DAYS=['월','화','수','목','금','토','일'];
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const toMin=t=>{const m=/^(\d{1,2}):(\d{2})/.exec(t||'');return m?+m[1]*60+ +m[2]:0};
const hm=m=>pad(Math.floor(m/60))+':'+pad(m%60);
const nmKey=x=>String(x||'').replace(/\s+/g,'').replace(/T$/,'');
const ddOf=(a,b)=>Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5);
function summ(D,now){
  const tdS=ymd(now),dow=DAYS[(now.getDay()+6)%7],my=nmKey(D.myName);
  const out={name:D.myName||'',at:D.at||0,cls:[],tk:[],ex:[],mk:[],cn:[],pre:[],inq:[]};
  const seenTk=new Set(),seenEx=new Set();
  for(const b of D.branches||[]){
    const me=(D.me||[]).find(m=>m.br===b.id);const stu=id=>(b.students||[]).find(s=>s.id===id);
    const per=(d,p)=>{const ps=(b.days||{})[d]||[];const s=toMin(ps[p]&&ps[p].time);const n=ps[p+1]?toMin(ps[p+1].time):0;return {s,e:n>s?n:s+90,name:(ps[p]&&ps[p].name)||''}};
    const C=id=>(b.classes||[]).find(c=>c.id===id);
    if(me){
      for(const o0 of (b.sessions||[]).filter(o=>o.d===dow)){
        const x=(b.ex||[]).find(e=>e.sid===o0.id&&e.date===tdS);
        const t=x&&x.kind!=='cancel'&&x.t?x.t:o0.t,p=x&&x.kind==='move'?x.p:o0.p;
        if(t!==me.t&&o0.t!==me.t)continue;
        const c=C(o0.cls);let m=((c&&c.members)||{})[o0.t]||[];if(o0.x&&o0.x.length)m=m.filter(i=>!o0.x.includes(i));if(o0.a&&o0.a.length)m=m.concat(o0.a.filter(i=>!m.includes(i)));
        const n=m.filter(i=>{const s=stu(i);return s&&!s.away}).length,r=per(dow,p);
        const tag=!x?'':x.kind==='cancel'?'휴강':x.kind==='sub'?(t===me.t?'대강':'대강 맡김'):'시간 옮김';
        out.cls.push({s:r.s,e:r.e,per:r.name,name:(c&&c.name)||'',n,tag,off:!!x&&(x.kind==='cancel'||t!==me.t),br:b.name});
      }
      for(const x of (b.specials||[]).filter(x=>(x.days||[]).includes(dow)&&x.t===me.t&&(!x.from||x.from<=tdS)&&(!x.until||x.until>=tdS))){const s=toMin(x.start);out.cls.push({s,e:s+(+x.dur||120),per:'특강',name:x.name||'특강',n:(x.ids||[]).length,tag:'특강',br:b.name})}
      for(const k of (b.notes||[]).filter(k=>k.t===me.t&&(!k.until||k.until>=tdS))){
        const r=per(k.d,k.p),c=C(k.cls),on=k.d===dow&&(!k.from||k.from<=tdS);
        out.mk.push({d:k.d,s:r.s,per:r.name,what:k.names||'',cls:(c&&c.name)||'',from:k.from||'',until:k.until||'',label:k.k||b.noteLabel||'보강'});
        if(on)out.cls.push({s:r.s,e:r.e,per:r.name,name:k.names||'보강',n:0,tag:k.k||'보강',br:b.name});
      }
    }
    for(const t of b.tk||[]){if(seenTk.has(t.id))continue;
      const dn=t.e?String(t.dn||'').split(',').filter(Boolean):[];
      if(!String(t.w||'').split(',').includes(my)||t.x||dn.includes(my))continue;
      seenTk.add(t.id);out.tk.push({k:t.k||'',t:t.t||'',s:t.s||'',g:t.g||'',j:t.j||'',d:t.d||'',n:t.n||0,m:t.m||''})}
    if(me||b.id===D.home){
      for(const x of b.exl||[]){const key=x.k+'|'+x.lab;if(x.to<tdS||seenEx.has(key))continue;seenEx.add(key);
        const L=x.dm||[];const mm=L.find(d=>/수학|공수|대수|미적|확통|기하/.test(d[1]!=null?d[1]:d.t))||L[0];const md=mm?(mm[0]||mm.d):'';
        out.ex.push({nm:x.nm||x.k,lab:x.lab||'',from:x.from,to:x.to,md})}
      const c=b.cns;
      if(c)for(const a of c.asg||[]){if(a.t&&me&&a.t!==me.t&&D.role!=='owner')continue;
        if((c.rec||[]).some(r=>r[0]===a.sid&&r[1]>=a.at))continue;const s=stu(a.sid);
        out.cn.push({name:(s&&s.name)||'',grade:(s&&s.grade)||'',note:a.note||'',by:a.by||'',at:a.at||''})}
      for(const s of b.students||[])if(s.pre&&s.from&&s.from>tdS&&!s.away)out.pre.push({name:s.name,grade:s.grade||'',school:s.school||'',from:s.from});
    }
  }
  const ox=((D.ox||{})[D.home]||{}).inq||[];
  for(const q of ox)if(q.st==='open')out.inq.push({name:q.name||'',grade:q.grade||'',school:q.school||'',want:q.want||'',reg:q.reg||''});
  out.cls.sort((a,z)=>a.s-z.s);out.tk.sort((a,z)=>(a.d||'9').localeCompare(z.d||'9')||a.g.localeCompare(z.g));
  out.ex.sort((a,z)=>(a.md||a.from).localeCompare(z.md||z.from));out.mk.sort((a,z)=>DAYS.indexOf(a.d)-DAYS.indexOf(z.d)||a.s-z.s);
  out.pre.sort((a,z)=>a.from.localeCompare(z.from));out.inq.sort((a,z)=>(a.want||'9').localeCompare(z.want||'9'));
  return out}
/*SUMM-END*/

/* ===== 시간표 자료 풀기 — 폰 시간표와 같은 방식(개인 코드 → 키 → 내 열쇠 묶음) ===== */
const H=async(k,s)=>new Uint8Array(await crypto.subtle.sign('HMAC',await crypto.subtle.importKey('raw',k,{name:'HMAC',hash:'SHA-256'},false,['sign']),te.encode(s)));
const gOpen=async(kRaw,o)=>JSON.parse(td.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(o.iv)},await crypto.subtle.importKey('raw',kRaw,'AES-GCM',false,['decrypt']),unb64(o.ct))));
async function ttDerive(code,j){const km=await crypto.subtle.importKey('raw',te.encode(code),'PBKDF2',false,['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:unb64(j.salt),iterations:j.it,hash:'SHA-256'},km,256))}
async function ttOpen(j,dk){const id=b64((await H(dk,'ymath-id')).slice(0,12));const es=(j.u||[]).filter(x=>x.id===id);if(!es.length)throw new Error('nocode');
  const wk=await H(dk,'ymath-wrap');let P=null;for(const e of es){try{P=await gOpen(wk,e);break}catch{}}if(!P)throw new Error('nocode');
  const com=await gOpen(unb64(P.kc),j.com);const branches=[];
  for(const id of Object.keys(j.br||{})){const k=(P.kb||{})[id];if(!k)continue;branches.push(await gOpen(unb64(k),j.br[id]))}
  return Object.assign({},com,{branches,me:P.me||[],myName:P.nm||'',role:P.role||'',home:P.home||'',ox:P.ox||{}})}
const ttKey=()=>{for(const k of ['sec_lk','m_lk']){try{const o=JSON.parse(ls.get(k)||'null');if(o&&o.k&&o.salt)return o}catch{}}return null};
let ttH='',ttBusy=false;
async function ttLoad(code){
  if(ttBusy)return;ttBusy=true;
  try{
    const r=await fetch(TTSRC+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('net');
    const j=await r.json();if(j.enc!==2)throw new Error('fmt');
    let dk=null;const lk=ttKey();
    if(code)dk=await ttDerive(code,j);else if(lk&&lk.salt===j.salt&&lk.it===j.it)dk=unb64(lk.k);
    if(!dk)throw new Error(lk?'relog':'none');
    if(code||j.h!==ttH||!S||ymd(new Date(S.got||0))!==ymd(new Date())){const D=await ttOpen(j,dk);S=summ(D,new Date());ttH=j.h;S.got=Date.now();
      ls.set('sec_lk',JSON.stringify({salt:j.salt,it:j.it,k:b64(dk)}));ls.set('sec_sum',JSON.stringify(S))}
    else if(S.stale){S.stale=false}
    $('#tt').hidden=true;drawToday();
  }catch(e){
    const m=e.message;
    if(code||m==='none'||m==='relog'||m==='nocode'){
      $('#tt').hidden=false;$('#tmsg').className=code||m==='relog'?'err':'';
      $('#tmsg').textContent=m==='nocode'?'코드가 맞지 않아요.':m==='relog'?'시간표 로그인이 풀렸어요. 코드를 다시 넣어 주세요.':m==='net'?'시간표 자료를 받지 못했어요. 인터넷을 확인해 주세요.':m==='fmt'?'시간표 자료 형식이 바뀌어서 읽지 못했어요.':'폰 시간표에 넣는 내 코드예요. 넣으면 오늘 수업·업무·시험·보강·상담·신입예정이 여기 보여요.';
      if(m==='nocode'||m==='relog'){S=null;ls.del('sec_sum');ls.del('sec_lk');drawToday()}
    }else if(S){S.stale=true;drawToday()}
  }
  ttBusy=false;
}
function drawSay(){
  const now=new Date(),nm=now.getHours()*60+now.getMinutes(),left=live().filter(x=>!x.done).length;let L=[];
  const same=S&&S.got&&ymd(new Date(S.got))===ymd(now);
  if(S&&same){const cls=S.cls.filter(c=>!c.off),cur=cls.find(c=>nm>=c.s&&nm<c.e),nx=cls.find(c=>c.s>nm);
    L.push(cls.length?`오늘 수업은 ${cls.length}개예요.`:'오늘은 수업이 없어요.');
    if(cur)L.push(`<em>지금 ${esc(cur.name)}</em> 시간이고,`);else if(nx)L.push(`다음은 <em>${hm(nx.s)} ${esc(nx.name)}</em>이고,`);else if(cls.length)L.push('수업은 다 끝났고,');
    L.push(S.cn.length?`상담 ${S.cn.length}건이 기다려요.`:S.tk.length?`업무 ${S.tk.length}개가 남았어요.`:left?`적어 둔 일이 ${left}개 있어요.`:'따로 챙길 건 없어요.');
  }else if(token)L.push(left?`적어 둔 일이 <em>${left}개</em> 있어요.`:'적어 둔 일은 다 끝났어요.');
  else L.push('부원장님 전용 비서예요.');
  const h=L.join('<br>');if($('#say').innerHTML!==h)$('#say').innerHTML=h}
const mdd=s=>s?(+s.slice(5,7))+'/'+(+s.slice(8,10)):'';
const dTag=dd=>dd===0?'<span class="tag hot">오늘</span>':dd<0?'':`<span class="tag${dd<=7?' ink':''}">D-${dd}</span>`;
const sec=(title,n,body,empty,cls)=>`<h2><b>${title}</b><span>${n?n+'개':''}</span></h2>`+(n?`<ul class="${cls||'card'}">${body}</ul>`:`<p class="empty">${empty}</p>`);
function drawToday(){
  drawSay();if(!S){$('#sum').innerHTML='';$('#nToday').textContent='';return}
  const now=new Date(),nm=now.getHours()*60+now.getMinutes(),tdS=ymd(now);
  const same=!!S.got&&ymd(new Date(S.got))===tdS;
  let h='';
  h+=sec('오늘 수업',same?S.cls.length:0,S.cls.map(c=>{const live=!c.off&&nm>=c.s&&nm<c.e,past=nm>=c.e;
    return `<li class="${live?'now':''}${c.off||past?' past':''}"><span class="t">${hm(c.s)}</span><b>${esc(c.name)}</b>${c.tag?`<span class="tag">${esc(c.tag)}</span>`:''}<small>${esc([c.per,c.n?c.n+'명':'',hm(c.e)+'까지'].filter(Boolean).join(' · '))}</small></li>`}).join(''),same?'오늘은 수업이 없어요.':'오늘 수업을 아직 받지 못했어요.','tl');
  h+=sec('내 업무',S.tk.length,S.tk.map(t=>`<li><span class="it"><b>${esc(t.t)}</b><small>${esc([t.k,[t.s,t.g].filter(Boolean).join(' '),t.j,t.n?t.n+'강':'',t.d?'기한 '+mdd(t.d):''].filter(Boolean).join(' · '))}${t.m?'<br>'+esc(t.m):''}</small></span>${t.d?dTag(ddOf(tdS,t.d))||'<span class="tag hot">기한 지남</span>':''}</li>`).join(''),'안 끝난 업무가 없어요.');
  const ex=S.ex.filter(x=>x.to>=tdS);
  const exV=exAll?ex:ex.slice(0,5);
  h+=sec('다가오는 시험',ex.length,exV.map(x=>{const dd=ddOf(tdS,x.md&&x.md>=tdS?x.md:x.from);
    return `<li><span class="it"><b>${esc(x.nm)}</b><small>${esc(x.lab)} · ${mdd(x.from)}${x.to!==x.from?'~'+mdd(x.to):''}${x.md?' · 수학 '+mdd(x.md):''}</small></span>${x.from<=tdS&&dd<=0?'<span class="tag hot">시험 중</span>':dTag(dd)}</li>`}).join(''),'다가오는 시험이 없어요.')+(ex.length>5?`<p style="margin:10px 0 0"><button class="btn" data-exall>${exAll?'가까운 시험만 보기':'시험 '+ex.length+'곳 모두 보기'}</button></p>`:'');
  h+=sec('보강',S.mk.length,S.mk.map(k=>`<li><span class="tm">${esc(k.d)} ${hm(k.s)}<small>${esc(k.per)}</small></span><span class="it"><b>${esc(k.what||k.label)}</b><small>${esc([k.cls,k.from&&k.until?(k.from===k.until?mdd(k.from):mdd(k.from)+'~'+mdd(k.until)):k.until?'~'+mdd(k.until):''].filter(Boolean).join(' · '))}</small></span></li>`).join(''),'잡힌 보강이 없어요.');
  h+=sec('상담',S.cn.length,S.cn.map(c=>`<li><span class="it"><b>${esc(c.name)} <small style="display:inline">${esc(c.grade)}</small></b><small>${esc(c.note)}${c.by?' — '+esc(c.by):''}${c.at?' · '+mdd(c.at):''}</small></span></li>`).join(''),'지정된 상담이 없어요.');
  const pre=S.pre.map(p=>`<li><span class="it"><b>${esc(p.name)} <small style="display:inline">${esc(p.grade)}</small></b><small>${esc(p.school)} · ${mdd(p.from)} 시작</small></span><span class="tag ink">입학 예정</span></li>`).join('')
    +S.inq.map(q=>`<li><span class="it"><b>${esc(q.name)} <small style="display:inline">${esc(q.grade)}</small></b><small>${esc([q.school,q.want?'희망 '+mdd(q.want):'',q.reg?'문의 '+mdd(q.reg):''].filter(Boolean).join(' · '))}</small></span><span class="tag">문의</span></li>`).join('');
  h+=sec('신입예정',S.pre.length+S.inq.length,pre,'신입 예정·문의가 없어요.');
  h+=`<p class="foot">${esc(S.name)} · 시간표 ${S.at?new Date(S.at).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'numeric',minute:'2-digit'})+' 적용분':''}${S.stale||!same?' · 새로 받지 못해 이전 내용이에요':''}</p>`;
  $('#sum').innerHTML=h;
  $('#nToday').textContent=String((same?S.cls.filter(c=>!c.off&&nm<c.e).length:0)||'');
}

/* ===== 내 기록: 저장소의 data.json ===== */
const seal=()=>b64(te.encode(JSON.stringify({items},null,1)));
const open=c=>JSON.parse(td.decode(unb64(c))).items||[];
const hdr=()=>({Authorization:'Bearer '+token,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'});
const merge=(a,b)=>{const m=new Map();for(const x of [...a,...b]){const o=m.get(x.id);if(!o||(x.u||0)>(o.u||0))m.set(x.id,x)}return [...m.values()]};
async function pull(){
  const r=await fetch(API+'?t='+Date.now(),{headers:hdr(),cache:'no-store'});
  if(r.status===401||r.status===403)throw new Error('key');
  if(r.status===404){isNew=true;return null}
  if(!r.ok)throw new Error('net');
  const j=await r.json();sha=j.sha;isNew=false;return open(j.content.replace(/\s/g,''));
}
async function push(){
  if(busy){dirty=true;return}
  busy=true;note('저장하는 중…');
  try{
    for(let i=0;i<3;i++){
      const body={message:'기록 저장',content:seal()};if(sha)body.sha=sha;
      const r=await fetch(API,{method:'PUT',headers:hdr(),body:JSON.stringify(body)});
      if(r.ok){sha=(await r.json()).content.sha;isNew=false;note('');break}
      if(r.status===409||r.status===422){const remote=await pull();if(remote)items=merge(remote,items);render();continue}
      throw new Error(r.status===401||r.status===403?'key':'net');
    }
  }catch(e){note(e.message==='key'?'연결 키가 맞지 않거나 기한이 지났어요. 설정에서 로그아웃 후 다시 넣어 주세요.':'저장하지 못했어요. 인터넷이 돌아오면 이 기기 내용으로 이어서 저장해요.')}
  busy=false;if(dirty){dirty=false;push()}
}
async function refresh(quiet){
  if(busy||document.activeElement?.isContentEditable)return;
  try{const remote=await pull();if(remote){const before=JSON.stringify(items);items=merge(remote,items);if(JSON.stringify(items)!==before){ls.set('sec_cache',JSON.stringify(items));render()}}if(!quiet)note('')}catch(e){if(!quiet)note('새로 받지 못했어요.')}
}
const note=s=>{$('#note').textContent=s};
const change=()=>{ls.set('sec_cache',JSON.stringify(items));render();push()};
const nice=s=>{const d=new Date(s+'T00:00');return isNaN(d)?s:d.toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'short'})};
const niceAt=s=>new Date(s).toLocaleString('ko-KR',{month:'numeric',day:'numeric',weekday:'short',hour:'numeric',minute:'2-digit'});
const live=()=>items.filter(x=>!x.del);
const by=(a,b)=>(a.c||0)-(b.c||0);
function row(x){
  return `<li class="${x.done?'done':''}" data-id="${esc(x.id)}"><button class="ck" data-act="done" aria-label="${x.done?'완료 취소':'완료'}"><i></i></button>
  <span class="body"><span class="tx" contenteditable="plaintext-only" spellcheck="false">${esc(x.text)}</span>${x.at?`<span class="at">알림 ${esc(niceAt(x.at))}</span>`:''}</span>
  <button class="sm" data-act="del">지우기</button></li>`}
const list=(a,empty)=>a.length?`<ul class="card">${a.map(row).join('')}</ul>`:`<p class="empty">${empty}</p>`;
function render(){
  if(document.activeElement?.isContentEditable)return;
  document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.v===view));
  $('#vToday').hidden=view!=='today';$('#vNotes').hidden=view!=='notes';
  $('#chips').innerHTML=KINDS.map(([k,l])=>`<button type="button" class="chip${k===kind?' on':''}" data-chip="${k}">${l}</button>`).join('');
  $('#dbox').hidden=kind!=='meeting';
  $('#t').placeholder=kind==='meeting'?'회의에서 얘기할 내용':kind==='todo'?'잊으면 안 되는 일':'떠오른 생각';
  const all=live(),v=all.filter(x=>showDone||!x.done);
  const m=v.filter(x=>x.kind==='meeting').sort((a,b)=>(a.date||'').localeCompare(b.date||'')||by(a,b));
  const dates=[...new Set(m.map(x=>x.date||''))];
  let h=dates.map(d=>`<h2><b>${esc(d?nice(d):'날짜 없음')} 회의</b></h2>`+list(m.filter(x=>(x.date||'')===d))).join('');
  if(!dates.length)h=`<h2><b>회의 안건</b></h2><p class="empty">적어 둔 회의 안건이 없어요.</p>`;
  h+=`<h2><b>기억할 일</b></h2>`+list(v.filter(x=>x.kind==='todo').sort(by),'기억할 일이 없어요.');
  h+=`<h2><b>아이디어</b></h2>`+list(v.filter(x=>x.kind==='idea').sort(by),'적어 둔 아이디어가 없어요.');
  const dn=all.filter(x=>x.done).length;
  if(dn)h+=`<p style="margin-top:22px"><button class="btn" data-act="toggle">${showDone?'끝낸 것 숨기기':'끝낸 것 '+dn+'개 보기'}</button></p>`;
  $('#out2').innerHTML=h;
  $('#nNotes').textContent=String(all.filter(x=>!x.done).length||'');
  const due=all.filter(x=>x.at&&x.rang&&!x.ack&&!x.done);
  drawSay();
  $('#rings').innerHTML=due.map(x=>`<div class="ring" data-id="${esc(x.id)}"><span><b>알림 · ${esc(niceAt(x.at))}</b>${esc(x.text)}</span><button data-ack>확인</button></div>`).join('');
}
function notify(text){
  try{if(!window.Notification||Notification.permission!=='granted')return;
    if(swReg&&swReg.showNotification)swReg.showNotification('비서',{body:text,icon:'icon-192.png',badge:'icon-192.png',tag:'sec'+Date.now()});else new Notification('비서',{body:text,icon:'icon-192.png'})}catch{}
}
function tick(){
  const now=Date.now();let hit=false;
  for(const x of live())if(x.at&&!x.rang&&!x.done&&new Date(x.at).getTime()<=now){x.rang=true;x.u=now;hit=true;notify(x.text);try{navigator.vibrate?.([200,100,200])}catch{}}
  if(hit)change();else if(view==='today'&&S)drawToday();
}
function nstate(){const p=window.Notification?Notification.permission:'none';
  $('#nstate').textContent=p==='granted'?'이 기기 알림: 켜짐':p==='denied'?'이 기기 알림: 막혀 있음 (브라우저 설정에서 풀어야 해요)':p==='none'?'이 브라우저는 알림 창을 지원하지 않아요. 화면 위 빨간 띠로 알려 드려요.':'이 기기 알림: 꺼짐';
  $('#non').hidden=p!=='default';$('#ttout').hidden=!ls.get('sec_lk')}
async function enter(){
  $('#gmsg').className='';$('#gmsg').textContent='여는 중…';let need=true;
  try{
    const remote=await pull();let c=[];try{c=JSON.parse(ls.get('sec_cache')||'[]')||[]}catch{}
    if(remote===null)items=c;else{items=merge(remote,c);need=JSON.stringify(items)!==JSON.stringify(remote)}
  }catch(e){
    let c=null;try{c=JSON.parse(ls.get('sec_cache')||'null')}catch{}
    if(e.message!=='key'&&c&&ls.get('sec_tk')){items=c;need=false;note('인터넷이 안 돼서 이 기기에 남은 내용을 보여 드려요.')}
    else{$('#gmsg').className='err';$('#gmsg').textContent=e.message==='key'?'연결 키가 맞지 않거나 기한이 지났어요.':'연결하지 못했어요. 인터넷을 확인해 주세요.';$('#gate').hidden=false;return}
  }
  ls.set('sec_tk',token);ls.set('sec_cache',JSON.stringify(items));
  $('#gate').hidden=true;$('#gear').hidden=false;$('#nav').hidden=false;
  try{S=JSON.parse(ls.get('sec_sum')||'null')}catch{}
  if(!location.hash)view=S||ttKey()?'today':'notes';
  render();drawToday();if(need&&(items.length||isNew))push();
  ttLoad();tick();setInterval(tick,20000);
  setInterval(()=>{if(!document.hidden){refresh(true);ttLoad()}},180000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden){refresh(true);ttLoad();tick()}});
}
$('#gate').addEventListener('submit',e=>{e.preventDefault();token=$('#tk').value.trim();if(token)enter()});
$('#tt').addEventListener('submit',e=>{e.preventDefault();const c=$('#tc').value.trim();if(c){$('#tmsg').className='';$('#tmsg').textContent='여는 중…';ttLoad(c).then(()=>{$('#tc').value=''})}});
$('#f').addEventListener('submit',e=>{
  e.preventDefault();const text=$('#t').value.trim();if(!text)return;const now=Date.now();
  const x={id:now.toString(36)+Math.random().toString(36).slice(2,6),kind,text,done:false,c:now,u:now};
  if(kind==='meeting')x.date=$('#d').value||ymd(new Date());
  if($('#a').value)x.at=$('#a').value;
  items.push(x);$('#t').value='';$('#a').value='';change();
});
$('#chips').addEventListener('click',e=>{const c=e.target.closest('[data-chip]');if(c){kind=c.dataset.chip;render()}});
$('#rings').addEventListener('click',e=>{if(!e.target.closest('[data-ack]'))return;const x=items.find(x=>x.id===e.target.closest('.ring').dataset.id);if(x){x.ack=true;x.u=Date.now();change()}});
$('#out2').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const act=b.dataset.act;
  if(act==='toggle'){showDone=!showDone;return render()}
  const x=items.find(x=>x.id===b.closest('li')?.dataset.id);if(!x)return;
  if(act==='done'){x.done=!x.done;x.u=Date.now();change()}
  else if(b.classList.contains('ask')){x.del=true;x.text='';x.u=Date.now();change()}
  else{b.classList.add('ask');b.textContent='정말 지우기';setTimeout(()=>{if(b.isConnected){b.classList.remove('ask');b.textContent='지우기'}},3000)}
});
$('#out2').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.isContentEditable){e.preventDefault();e.target.blur()}});
$('#out2').addEventListener('focusout',e=>{
  if(!e.target.isContentEditable)return;
  const x=items.find(x=>x.id===e.target.closest('li')?.dataset.id),v=e.target.textContent.trim();
  if(x&&v&&v!==x.text){x.text=v;x.u=Date.now();setTimeout(change,0)}else setTimeout(render,0);
});
$('#sum').addEventListener('click',e=>{if(e.target.closest('[data-exall]')){exAll=!exAll;drawToday()}});
$('#gear').addEventListener('click',()=>{const o=$('#set').classList.toggle('open');$('#gear').setAttribute('aria-expanded',o);nstate()});
$('#non').addEventListener('click',async()=>{try{await Notification.requestPermission()}catch{}nstate()});
$('#sync').addEventListener('click',()=>{note('새로 받는 중…');refresh(false);ttLoad()});
$('#ttout').addEventListener('click',()=>{ls.del('sec_lk');ls.del('sec_sum');S=null;ttH='';drawToday();$('#tt').hidden=false;nstate()});
$('#out').addEventListener('click',e=>{const b=e.currentTarget;
  if(b.dataset.ask){['sec_tk','sec_cache','sec_lk','sec_sum'].forEach(ls.del);location.reload()}
  else{b.dataset.ask=1;b.textContent='정말 로그아웃 (이 기기의 연결 키를 지워요)'}});
const route=()=>{const h=location.hash.slice(1);if(h==='today'||h==='notes'){view=h;render()}};
addEventListener('hashchange',route);
$('#today').textContent=new Date().toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'long'});
$('#d').value=ymd(new Date());
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').then(r=>{swReg=r}).catch(()=>{});
route();drawSay();
token=ls.get('sec_tk')||'';
if(token){$('#tk').value=token;enter()}else $('#gate').hidden=false;
}
</script>
